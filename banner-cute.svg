<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
<style>
    @keyframes tailwag { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes pawfade { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.4; } }
    .tail { transform-origin: 40px 210px; animation: tailwag 2.4s ease-in-out infinite; }
    .eyes { transform-origin: center; animation: blink 4.5s ease-in-out infinite; }
    .bob { animation: bob 3s ease-in-out infinite; }
    .paw { animation: pawfade 3.5s ease-in-out infinite; }
</style>
<defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.3" fill="#C98A4B" opacity="0.35"/>
    </pattern>
</defs>

<!-- outer frame -->
<rect x="6" y="6" width="788" height="308" rx="26" fill="#FDF0DC" stroke="#8B5A2B" stroke-width="4"/>

<!-- top-left tag pill -->
<rect x="28" y="26" width="150" height="34" rx="17" fill="#A9DCEF" stroke="#5FA9C4" stroke-width="1.5"/>
<text x="103" y="48" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2E5A6B">by Talia-Apr</text>

<!-- top-center title pill -->
<rect x="250" y="22" width="300" height="42" rx="21" fill="#FFF9EE" stroke="#8B5A2B" stroke-width="2"/>
<text x="400" y="48" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#6B4226">Full Stack Developer</text>

<!-- top-right icon buttons -->
<circle cx="622" cy="43" r="19" fill="#7EC8E3" stroke="#4A8FAE" stroke-width="1.5"/>
<text x="622" y="49" text-anchor="middle" font-size="15">🐾</text>
<circle cx="668" cy="43" r="19" fill="#F2B84B" stroke="#C98A2E" stroke-width="1.5"/>
<text x="668" y="49" text-anchor="middle" font-size="15">🍮</text>
<circle cx="714" cy="43" r="19" fill="#8B5A2B" stroke="#6B4226" stroke-width="1.5"/>
<text x="714" y="49" text-anchor="middle" font-size="14">🐱</text>

<!-- main content panel -->
<rect x="28" y="78" width="744" height="150" rx="22" fill="#8B5A2B"/>
<rect x="28" y="78" width="744" height="26" fill="url(#dots)"/>
<rect x="34" y="110" width="732" height="112" rx="18" fill="#FFF9EE"/>

<!-- cat avatar -->
<g class="bob" transform="translate(105,168)">
  <path class="tail" d="M 40 20 Q 75 10 70 -30 Q 68 -45 55 -40 Q 62 -10 40 5 Z" fill="#E8A33D"/>
  <circle cx="0" cy="0" r="52" fill="#FFF6E8" stroke="#8B5A2B" stroke-width="3"/>
  <path d="M -50 -15 A 52 52 0 0 1 -10 -50 L -30 -52 Q -55 -45 -50 -15 Z" fill="#2B2320"/>
  <path d="M 5 -50 A 52 52 0 0 1 45 -18 Q 50 -40 30 -50 Q 15 -55 5 -50 Z" fill="#E8A33D"/>
  <path d="M -38 -48 L -22 -20 L -8 -50 Z" fill="#FFF6E8" stroke="#8B5A2B" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 10 -50 L 24 -22 L 40 -50 Z" fill="#FFF6E8" stroke="#8B5A2B" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M -33 -42 L -22 -26 L -13 -42 Z" fill="#F6C6C6"/>
  <path d="M 15 -42 L 24 -28 L 33 -42 Z" fill="#F6C6C6"/>
  <g class="eyes">
    <path d="M -26 -3 Q -18 -10 -10 -3" fill="none" stroke="#3A2A20" stroke-width="3" stroke-linecap="round"/>
    <path d="M 10 -3 Q 18 -10 26 -3" fill="none" stroke="#3A2A20" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M -3 10 Q 0 14 3 10" fill="none" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <path d="M 0 10 L 0 15" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <path d="M 0 15 Q -8 20 -16 17" fill="none" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <path d="M 0 15 Q 8 20 16 17" fill="none" stroke="#3A2A20" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#3A2A20" stroke-width="1.3" stroke-linecap="round" opacity="0.7">
    <line x1="-52" y1="0" x2="-30" y2="-2"/>
    <line x1="-52" y1="8" x2="-30" y2="6"/>
    <line x1="52" y1="0" x2="30" y2="-2"/>
    <line x1="52" y1="8" x2="30" y2="6"/>
  </g>
  <path d="M -20 -32 Q -25 -20 -18 -15 Q -8 -8 0 -12 Q -12 -20 -20 -32 Z" fill="#2B2320" opacity="0.9"/>
</g>

<!-- name + role -->
<text x="185" y="150" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#6B4226">Talia Aprianti 🐾</text>
<text x="185" y="176" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="13" fill="#A9793F">Front-End</text>
<text x="255" y="176" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="13" fill="#A9793F">/</text>
<text x="268" y="176" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="13" fill="#A9793F">React</text>
<text x="315" y="176" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="13" fill="#A9793F">/</text>
<text x="328" y="176" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="13" fill="#A9793F">Node.js</text>

<!-- status pills -->
<rect x="185" y="192" width="150" height="30" rx="15" fill="#6B4226"/>
<text x="260" y="212" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FFF6E8">status: coding ✨</text>

<rect x="345" y="192" width="200" height="30" rx="15" fill="#F2E4C6" stroke="#C98A4B" stroke-width="1.3"/>
<text x="445" y="212" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#8B5A2B">github.com/Talia-Apr</text>

<!-- tech stack pills row -->
<g font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="12" font-weight="700">
  <rect x="180" y="252" width="66" height="30" rx="15" fill="#FFF9EE" stroke="#8B5A2B" stroke-width="1.5"/>
  <text x="213" y="272" text-anchor="middle" fill="#6B4226">HTML</text>

  <rect x="258" y="252" width="58" height="30" rx="15" fill="#FFF9EE" stroke="#8B5A2B" stroke-width="1.5"/>
  <text x="287" y="272" text-anchor="middle" fill="#6B4226">CSS</text>

  <rect x="328" y="252" width="72" height="30" rx="15" fill="#FFE9C7" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="364" y="272" text-anchor="middle" fill="#8B5A2B">React</text>

  <rect x="412" y="252" width="112" height="30" rx="15" fill="#FFE9C7" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="468" y="272" text-anchor="middle" fill="#8B5A2B">JavaScript</text>

  <rect x="536" y="252" width="90" height="30" rx="15" fill="#F6D8D8" stroke="#D97A7A" stroke-width="1.5"/>
  <text x="581" y="272" text-anchor="middle" fill="#8B5A2B">Node.js</text>
</g>

<!-- decorative paw prints -->
<g class="paw" fill="#8B5A2B">
  <circle cx="710" cy="255" r="4"/>
  <circle cx="720" cy="248" r="3"/>
  <circle cx="722" cy="260" r="3"/>
  <circle cx="730" cy="253" r="2.5"/>
</g>
<g class="paw" style="animation-delay:1.5s" fill="#E8A33D">
  <circle cx="60" cy="255" r="4"/>
  <circle cx="70" cy="248" r="3"/>
  <circle cx="72" cy="260" r="3"/>
  <circle cx="80" cy="253" r="2.5"/>
</g>

<text x="400" y="305" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="10" fill="#B89568">( made with ⌨ &amp; ☕ )</text>
</svg>
