<svg xmlns="http://www.w3.org/2000/svg" width="800" height="325" viewBox="0 0 800 325">
<style>
    @keyframes pawfade { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.4; } }
    .paw { animation: pawfade 3.5s ease-in-out infinite; }
</style>
<defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.3" fill="#C98A4B" opacity="0.35"/>
    </pattern>
</defs>

<!-- outer frame -->
<rect x="6" y="6" width="788" height="313" rx="26" fill="#FDF0DC" stroke="#8B5A2B" stroke-width="4"/>

<!-- top-left tag pill -->
<rect x="28" y="26" width="150" height="34" rx="17" fill="#A9DCEF" stroke="#5FA9C4" stroke-width="1.5"/>
<text x="103" y="48" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2E5A6B">by Talia-Apr</text>

<!-- top-center title pill -->
<rect x="250" y="22" width="300" height="42" rx="21" fill="#FFF9EE" stroke="#8B5A2B" stroke-width="2"/>
<text x="400" y="48" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#6B4226">Full Stack Developer</text>

<!-- top-right icon buttons -->
<circle cx="622" cy="43" r="19" fill="#7EC8E3" stroke="#4A8FAE" stroke-width="1.5"/>
<g fill="#FFFFFF"><circle cx="622" cy="47" r="4"/><circle cx="615" cy="39" r="2.2"/><circle cx="629" cy="39" r="2.2"/><circle cx="611" cy="46" r="2"/><circle cx="633" cy="46" r="2"/></g>

<circle cx="668" cy="43" r="19" fill="#F2B84B" stroke="#C98A2E" stroke-width="1.5"/>
<circle cx="668" cy="45" r="8" fill="#FFF6E8"/>

<circle cx="714" cy="43" r="19" fill="#8B5A2B" stroke="#6B4226" stroke-width="1.5"/>
<path d="M 705 50 A 9 9 0 0 1 723 50 L 719 45 L 714 49 L 709 45 Z" fill="#FFF6E8"/>

<!-- main content panel -->
<rect x="28" y="78" width="744" height="155" rx="22" fill="#8B5A2B"/>
<rect x="28" y="78" width="744" height="26" fill="url(#dots)"/>
<rect x="34" y="110" width="732" height="117" rx="18" fill="#FFF9EE"/>

<!-- name + role (centered) -->
<text x="400" y="158" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="27" font-weight="700" fill="#6B4226">Talia Aprianti</text>
<text x="400" y="183" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="13" fill="#A9793F">Front-End / React / Node.js</text>

<!-- tech stack pills row -->
<g font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="12" font-weight="700">
  <rect x="180" y="257" width="66" height="30" rx="15" fill="#FFF9EE" stroke="#8B5A2B" stroke-width="1.5"/>
  <text x="213" y="277" text-anchor="middle" fill="#6B4226">HTML</text>

  <rect x="258" y="257" width="58" height="30" rx="15" fill="#FFF9EE" stroke="#8B5A2B" stroke-width="1.5"/>
  <text x="287" y="277" text-anchor="middle" fill="#6B4226">CSS</text>

  <rect x="328" y="257" width="72" height="30" rx="15" fill="#FFE9C7" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="364" y="277" text-anchor="middle" fill="#8B5A2B">React</text>

  <rect x="412" y="257" width="112" height="30" rx="15" fill="#FFE9C7" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="468" y="277" text-anchor="middle" fill="#8B5A2B">JavaScript</text>

  <rect x="536" y="257" width="90" height="30" rx="15" fill="#F6D8D8" stroke="#D97A7A" stroke-width="1.5"/>
  <text x="581" y="277" text-anchor="middle" fill="#8B5A2B">Node.js</text>
</g>

<!-- decorative paw prints -->
<g class="paw" fill="#8B5A2B">
  <circle cx="710" cy="260" r="4"/>
  <circle cx="720" cy="253" r="3"/>
  <circle cx="722" cy="265" r="3"/>
  <circle cx="730" cy="258" r="2.5"/>
</g>
<g class="paw" style="animation-delay:1.5s" fill="#E8A33D">
  <circle cx="60" cy="260" r="4"/>
  <circle cx="70" cy="253" r="3"/>
  <circle cx="72" cy="265" r="3"/>
  <circle cx="80" cy="258" r="2.5"/>
</g>

<text x="400" y="310" text-anchor="middle" font-family="'Comic Sans MS', 'Baloo 2', 'Segoe UI', sans-serif" font-size="10" fill="#B89568">( made with love &amp; coffee )</text>
</svg>
