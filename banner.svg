<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<style>
    @keyframes drift-r { 0%, 100% { transform: translate(0,0); opacity: 0.6; } 50% { transform: translate(35px,-18px); opacity: 1; } }
    @keyframes drift-l { 0%, 100% { transform: translate(0,0); opacity: 0.55; } 50% { transform: translate(-30px,16px); opacity: 0.95; } }
    @keyframes drift-u { 0%, 100% { transform: translate(0,0); opacity: 0.7; } 50% { transform: translate(25px,-25px); opacity: 1.05; } }
    @keyframes ring-pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.35; } }
    @keyframes particle-fade { 0%, 100% { opacity: 0; } 40%, 60% { opacity: var(--peak, 0.5); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes scan { 0% { transform: translate(-900px,0); } 100% { transform: translate(900px,0); } }
    .g-scan { animation: scan 4.5s linear infinite; }
    .g-dr { animation: drift-r 5s ease-in-out infinite; }
    .g-dl { animation: drift-l 9s ease-in-out infinite 0.3s; }
    .g-du { animation: drift-u 7s ease-in-out infinite 0.6s; }
    .g-ring { animation: ring-pulse 4s ease-in-out infinite; }
    .particle { animation: particle-fade var(--dur) ease-in-out infinite; opacity: 0; }
    .cursor { animation: blink 1.1s step-end infinite; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .particle { opacity: 0.3 !important; }
    }
</style>
<defs>
    <radialGradient id="gTeal" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(51,214,192,0.55)"/><stop offset="100%" stop-color="rgba(51,214,192,0)"/></radialGradient>
    <radialGradient id="gViolet" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(124,111,240,0.5)"/><stop offset="100%" stop-color="rgba(124,111,240,0)"/></radialGradient>
    <radialGradient id="gAmber" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(245,166,35,0.4)"/><stop offset="100%" stop-color="rgba(245,166,35,0)"/></radialGradient>
    <radialGradient id="gBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(79,168,224,0.45)"/><stop offset="100%" stop-color="rgba(79,168,224,0)"/></radialGradient>
    <linearGradient id="scg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(51,214,192,0)"/>
      <stop offset="40%" stop-color="rgba(51,214,192,0.1)"/>
      <stop offset="50%" stop-color="rgba(124,111,240,0.4)"/>
      <stop offset="60%" stop-color="rgba(51,214,192,0.1)"/>
      <stop offset="100%" stop-color="rgba(51,214,192,0)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(51,214,192,0.06)" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>

<!-- ===== BLOCK 1 ===== -->
<g>
  <rect width="800" height="300" fill="#060B14"/>
  <rect width="800" height="300" fill="url(#grid)"/>

  <ellipse class="g-dr" cx="150" cy="110" rx="170" ry="100" fill="url(#gTeal)"/>
  <ellipse class="g-du" cx="650" cy="210" rx="160" ry="80" fill="url(#gViolet)"/>
  <!-- <ellipse class="g-dl" cx="230" cy="240" rx="150" ry="85" fill="url(#gBlue)" style="animation-delay:1.2s"/> -->
  <circle class="g-ring" cx="700" cy="150" r="90" fill="none" stroke="rgba(51,214,192,0.18)" stroke-width="0.8"/>
  <circle class="g-ring" cx="700" cy="150" r="60" fill="none" stroke="rgba(124,111,240,0.15)" stroke-width="0.6" style="animation-delay:0.6s"/>

  <circle class="particle" cx="720" cy="60" r="1.6" fill="#7ee7ff" style="--dur:7.2s; --peak:0.5; animation-delay:1.1s;"/>
  <circle class="particle" cx="60" cy="200" r="1.4" fill="#e8c8ff" style="--dur:6.4s; --peak:0.45; animation-delay:2.4s;"/>
  <circle class="particle" cx="480" cy="30" r="1.2" fill="#ffd699" style="--dur:8.1s; --peak:0.4; animation-delay:0.5s;"/>
  <circle class="particle" cx="760" cy="240" r="1.3" fill="#7ee7ff" style="--dur:7.8s; --peak:0.5; animation-delay:3.3s;"/>
  <circle class="particle" cx="30" cy="60" r="1.1" fill="#e8c8ff" style="--dur:6.9s; --peak:0.4; animation-delay:4.0s;"/>
  <circle class="particle" cx="380" cy="270" r="1.5" fill="#ffd699" style="--dur:9.0s; --peak:0.45; animation-delay:1.8s;"/>
  <rect class="g-scan" x="-200" y="174" width="200" height="2" fill="url(#scg)" style="animation-delay:1.5s"/>

  <text x="400" y="120" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="52" fill="#EAF2FF" filter="url(#glow)">Talia Aprianti</text>

  <text x="400" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#33D6C0" letter-spacing="4">SOFTWARE ENGINEER</text>

  <line x1="260" y1="175" x2="540" y2="175" stroke="rgba(51,214,192,0.2)" stroke-width="1"/>

  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#EAF2FF">
    <rect x="50" y="195" width="186" height="28" rx="14" fill="#0F1B2E" stroke="#33D6C0" stroke-width="1"/>
    <text x="143" y="213" text-anchor="middle">Full Stack Developer</text>

    <rect x="246" y="195" width="164" height="28" rx="14" fill="#0F1B2E" stroke="#7C6FF0" stroke-width="1"/>
    <text x="328" y="213" text-anchor="middle">Web Developer</text>

    <rect x="424" y="195" width="148" height="28" rx="14" fill="#0F1B2E" stroke="#4FA8E0" stroke-width="1"/>
    <text x="498" y="213" text-anchor="middle">Mobile Developer</text>

    <rect x="586" y="195" width="142" height="28" rx="14" fill="#0F1B2E" stroke="#F5A623" stroke-width="1"/>
    <text x="657" y="213" text-anchor="middle">Problem Solver</text>
  </g>
</g>

<!-- ===== BLOCK 2 ===== -->
<g transform="translate(0, 300)">
  <rect width="800" height="200" fill="#060B14" />
  <rect width="800" height="200" fill="url(#grid)"/>

  <ellipse class="g-dr" cx="400" cy="100" rx="220" ry="110" fill="url(#gBlue)"/>

  
  <circle class="particle" cx="700" cy="40" r="1.4" fill="#7ee7ff" style="--dur:7s; --peak:0.5; animation-delay:0.8s;"/>
  <circle class="particle" cx="70" cy="160" r="1.3" fill="#e8c8ff" style="--dur:6.4s; --peak:0.45; animation-delay:2s;"/>
  <circle class="particle" cx="400" cy="25" r="1.1" fill="#ffd699" style="--dur:8s; --peak:0.4; animation-delay:1.2s;"/>
 
