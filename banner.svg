<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
<style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 900; font-display: swap; src: url(https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuGkyMZhrib2Bg-4.woff2) format('woff2'); }
    @keyframes drift-r { 0%, 100% { transform: translate(0,0); opacity: 0.6; } 50% { transform: translate(35px,-18px); opacity: 1; } }
    @keyframes drift-l { 0%, 100% { transform: translate(0,0); opacity: 0.55; } 50% { transform: translate(-30px,16px); opacity: 0.95; } }
    @keyframes drift-u { 0%, 100% { transform: translate(0,0); opacity: 0.7; } 50% { transform: translate(25px,-25px); opacity: 1.05; } }
    @keyframes ring-pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.35; } }
    @keyframes particle-fade { 0%, 100% { opacity: 0; } 40%, 60% { opacity: var(--peak, 0.5); } }
    @keyframes bar-grow { 0%, 100% { width: 0; } 40%, 70% { width: var(--full); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .g-dr { animation: drift-r 8s ease-in-out infinite; }
    .g-dl { animation: drift-l 9s ease-in-out infinite 0.3s; }
    .g-du { animation: drift-u 7s ease-in-out infinite 0.6s; }
    .g-ring { animation: ring-pulse 4s ease-in-out infinite; }
    .particle { animation: particle-fade var(--dur) ease-in-out infinite; opacity: 0; }
    .cursor { animation: blink 1.1s step-end infinite; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .particle { opacity: 0.3 !important; }
    }
</style>
<defs>
    <radialGradient id="gTeal" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(51,214,192,0.55)"/><stop offset="100%" stop-color="rgba(51,214,192,0)"/></radialGradient>
    <radialGradient id="gViolet" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(124,111,240,0.5)"/><stop offset="100%" stop-color="rgba(124,111,240,0)"/></radialGradient>
    <radialGradient id="gAmber" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(245,166,35,0.4)"/><stop offset="100%" stop-color="rgba(245,166,35,0)"/></radialGradient>
    <linearGradient id="layerUI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#33D6C0" stop-opacity="0.9"/><stop offset="100%" stop-color="#33D6C0" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="layerAPI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C6FF0" stop-opacity="0.9"/><stop offset="100%" stop-color="#7C6FF0" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="layerData" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.9"/><stop offset="100%" stop-color="#F5A623" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(51,214,192,0.06)" stroke-width="0.5"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>

<rect width="800" height="300" rx="20" fill="#060B14" stroke="rgba(51,214,192,0.18)" stroke-width="1.5"/>
<rect width="800" height="300" rx="20" fill="url(#grid)"/>

<!-- drifting ambient glows -->
<ellipse class="g-dr" cx="150" cy="80" rx="170" ry="100" fill="url(#gTeal)"/>
<ellipse class="g-dl" cx="620" cy="70" rx="150" ry="90" fill="url(#gViolet)"/>
<ellipse class="g-du" cx="650" cy="220" rx="140" ry="80" fill="url(#gAmber)"/>
<circle class="g-ring" cx="700" cy="150" r="90" fill="none" stroke="rgba(51,214,192,0.18)" stroke-width="0.8"/>
<circle class="g-ring" cx="700" cy="150" r="60" fill="none" stroke="rgba(124,111,240,0.15)" stroke-width="0.6" style="animation-delay:0.6s"/>

<!-- floating particles -->
<circle class="particle" cx="720" cy="60" r="1.6" fill="#7ee7ff" style="--dur:7.2s; --peak:0.5; animation-delay:1.1s;"/>
<circle class="particle" cx="60" cy="200" r="1.4" fill="#e8c8ff" style="--dur:6.4s; --peak:0.45; animation-delay:2.4s;"/>
<circle class="particle" cx="480" cy="30" r="1.2" fill="#ffd699" style="--dur:8.1s; --peak:0.4; animation-delay:0.5s;"/>
<circle class="particle" cx="760" cy="240" r="1.3" fill="#7ee7ff" style="--dur:7.8s; --peak:0.5; animation-delay:3.3s;"/>
<circle class="particle" cx="30" cy="60" r="1.1" fill="#e8c8ff" style="--dur:6.9s; --peak:0.4; animation-delay:4.0s;"/>
<circle class="particle" cx="380" cy="270" r="1.5" fill="#ffd699" style="--dur:9.0s; --peak:0.45; animation-delay:1.8s;"/>

<!-- Name + tagline (centered) -->
<text x="400" y="120" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="52" fill="#EAF2FF" filter="url(#glow)">Talia Aprianti</text>

<text x="400" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#33D6C0" letter-spacing="4">FULL STACK DEVELOPER</text>

<line x1="260" y1="175" x2="540" y2="175" stroke="rgba(51,214,192,0.2)" stroke-width="1"/>

<!-- tech pills (centered) -->
<g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="13" fill="#EAF2FF">
  <rect x="128" y="195" width="76" height="28" rx="14" fill="#0F1B2E" stroke="#33D6C0" stroke-width="1"/>
  <text x="142" y="213">HTML</text>

  <rect x="218" y="195" width="72" height="28" rx="14" fill="#0F1B2E" stroke="#33D6C0" stroke-width="1"/>
  <text x="232" y="213">CSS</text>

  <rect x="304" y="195" width="90" height="28" rx="14" fill="#0F1B2E" stroke="#7C6FF0" stroke-width="1"/>
  <text x="316" y="213">React</text>

  <rect x="408" y="195" width="130" height="28" rx="14" fill="#0F1B2E" stroke="#7C6FF0" stroke-width="1"/>
  <text x="420" y="213">JavaScript</text>

  <rect x="552" y="195" width="120" height="28" rx="14" fill="#0F1B2E" stroke="#F5A623" stroke-width="1"/>
  <text x="566" y="213">Node.js</text>
</g>

<text x="400" y="270" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3E4E66">github.com/Talia-Apr</text>

<!-- Divider  -->
<line x1="200" y1="310" x2="600" y2="310" stroke="rgba(51,214,192,0.15)" stroke-width="1"/>
 
<!-- Label section -->
<text x="400" y="335" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#33D6C0" letter-spacing="4">GITHUB STATS</text>
 
<!-- Stats card -->
<image href="https://github-readme-stats.vercel.app/api?username=Talia-Apr&amp;show_icons=true&amp;hide_border=true&amp;bg_color=00000000&amp;title_color=33D6C0&amp;icon_color=F5A623&amp;text_color=EAF2FF"
       x="60" y="350" width="430" height="195" preserveAspectRatio="xMidYMid meet"/>
 
